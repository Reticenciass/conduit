# Manifesto de compatibilidade do motor. Versões desconhecidas não são aceitas
# automaticamente para recursos avançados; valide-as no laboratório autorizado.

[ctfws]
version = "0.28.0"
schema = 34

[openssh]
minimum_major = 8
tested_capabilities = ["local-forward", "remote-forward", "dynamic-socks", "pty"]

[asyncssh]
