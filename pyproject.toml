[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-workspace"
version = "0.28.4"
description = "A safe, local-first workspace for organizing CTF infrastructure findings."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CTF Workspace contributors" }]
dependencies = [
    "pydantic>=2.7",
    "rich>=13.7",
    "textual>=0.60",
    "typer>=0.16",
    "psutil>=6.0",
    "asyncssh>=2.19",
    "cryptography>=42.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]
dev = [
    "black>=24.8",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
ctfws = "ctfws.main:app"
conduit = "ctfws.main:app"
ctfws-namespace-helper = "ctfws.privileged_helper:main"

[tool.setuptools.packages.find]
include = ["ctfws*"]

[tool.setuptools.package-data]
ctfws = ["frontend/**/*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
per-file-ignores = { "ctfws/web.py" = ["E501"] }

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
